name: Release Module

# Builds the module and publishes a GitHub release whenever a version tag
# (e.g. v1.0.0) is pushed. Foundry reads the release assets:
#   - module.json  -> served at .../releases/latest/download/module.json (the manifest URL)
#   - module.zip   -> the versioned package Foundry downloads and installs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build module
        run: npm run build

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Write release URLs into module.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          jq \
            --arg version "$VERSION" \
            --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
            --arg download "https://github.com/$REPO/releases/download/v$VERSION/module.zip" \
            --arg url "https://github.com/$REPO" \
            '.version = $version | .manifest = $manifest | .download = $download | .url = $url' \
            module.json > module.tmp.json
          mv module.tmp.json module.json
          echo "----- module.json -----"
          cat module.json

      - name: Create module.zip
        run: |
          zip -r module.zip \
            module.json \
            LICENSE \
            README.md \
            CHANGELOG.md \
            OPEN_TAROKKA_MACRO.js \
            dist/tarokka.js \
            dist/tarokka.css \
            dist/empty.html \
            lang \
            assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            module.json
            module.zip
